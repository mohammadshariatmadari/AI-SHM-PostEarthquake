# ==============================================================================
# AI-Driven SHM Framework Configuration File (config.yaml)
# Project: AI-Driven Structural Health Monitoring for Post-Earthquake Assessment
# ==============================================================================

system:
  project_name: "AI-SHM-PostEarthquake"
  version: "4.0.0"
  seed: 42
  device: "cuda"

dataset:
  uav_vision_dir: "./data/uav_images"
  mems_vibration_dir: "./data/mems_signals"
  global_benchmarks:
    - "turkiye_2023"
    - "nepal_2015"
    - "taiwan_2024"
    - "italy_dado"
  batch_size: 32
  num_workers: 4

vision_model:
  architecture: "YOLOv11-STCHMDA-CVT"
  image_size: 640
  num_classes: 4
  confidence_threshold: 0.25
  iou_threshold: 0.45

vibration_model:
  architecture: "1D-CNN-BiLSTM"
  sampling_rate_hz: 100
  window_length_sec: 10
  fft_points: 4096
  num_features: 128

physics_informed_loss:
  enable_pinn: true
  mdof_equation_weight: 0.15
  vs1_shear_wave_threshold_m_s: 215.0
  stiffness_loss_ratio_limit: 0.19

edge_deployment:
  target_hardware: "RP2040"
  quantization_type: "int8"
  ram_budget_kb: 264
  flash_budget_mb: 2.0
  max_latency_ms: 525

eoc_integration:
  mqtt_broker: "eoc-gis.city-disaster-net.org"
  mqtt_port: 8883
  topic_prefix: "shm/city/zone_a/building_"
  qos_level: 1
  payload_format: "compressed_2byte"
